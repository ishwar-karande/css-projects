<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Cinzel:wght@400..900&family=Michroma&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Cinzel:wght@400..900&family=Michroma&family=Oxanium:wght@200..800&display=swap');
    </style>
    <style>
        :root {
            --color: black;
            --secolor: rgba(255, 255, 255, 0.914);
            --font: "Oxanium";
            --pad: 15px;
            --margin: 20px;
            --border: 2px solid #1F1212;
            --br: 10px;
            --font-size: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(233, 231, 231);
            --margin: 43px;
            margin: var(--margin);
        }



        .navbar {
            background: linear-gradient(90deg, #333, #111);
            --br: 30px;
            border-radius: var(--br);
        }


        ul {
            display: flex;
            align-items: center;
            box-shadow: none;
        }

        ul li {
            list-style-type: none;
            color: var(--secolor);
            font-family: var(--font);
            --pad: 12px;
            padding: var(--pad);
            --margin: 10px;
            margin: var(--margin);
            border: var(--border);
            font-size: var(--font-size);
            --br: 20px;
            border-radius: var(--br);
            box-shadow:
                inset 1px 1px 5px grey,
                0 1px 8px grey;      
        }

        #buttonli {
            border: none;
            margin-left: auto;
            box-shadow: none;
        }

        #button {
            --pad: 10px 10px;
            padding: var(--pad);
            --br: 15px;
            border-radius: var(--br);
            font-size: var(--font-size);
            font-family: var(--font);
            border: none;
            --color: white;
            color: var(--color);
            background: #222;
            box-shadow:
                inset 0 0 5px grey,
                0 3px 8px grey;
            cursor: pointer;
        }

v
        #button:hover {
            background: #333;
        }

        #button:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <nav>
        <div class="navbar">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
                <li>Services</li>
                <li id="buttonli"><button id="button">Login</button></li>
            </ul>
        </div>
    </nav>
</body>

</html>
